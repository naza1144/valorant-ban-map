<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valorant Map Ban</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>VALORANT <span>MAP BAN</span></h1>
  </header>

  <section id="setup" class="panel">
    <h2>ตั้งค่า</h2>
    <div class="row">
      <label>ทีม A <input id="teamA" value="Team A"></label>
      <label>ทีม B <input id="teamB" value="Team B"></label>
    </div>
    <div class="sheetbox">
      <div class="row">
        <label>วันที่ <select id="sheetDate"></select></label>
        <label>แมตช์ <select id="sheetMatch"></select></label>
        <button id="loadSheetBtn" type="button">โหลดรายการใหม่</button>
      </div>
      <p class="hint" id="sheetMsg">กำลังโหลดรายการแมตช์…</p>
    </div>
    <p class="hint">Map Pool: Abyss, Bind, Corrode, Haven, Lotus, Summit, Sunset — ban 2 → pick 2 → ban 2 → แมพสุดท้ายตัดสินฝั่งด้วยการทอยเหรียญ</p>
    <div class="row">
      <button id="startBtn" class="primary">เริ่ม Ban/Pick</button>
      <button id="resultBtn" class="primary alt" type="button">บันทึกผลการแข่ง</button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div id="status" class="status"></div>
    <div id="maps" class="maps"></div>
    <div class="controls">
      <button id="undoBtn">↶ ย้อนกลับ</button>
      <button id="resetBtn">⟲ เริ่มใหม่</button>
    </div>
    <div id="result" class="panel hidden"></div>
    <div id="log" class="log"></div>
  </section>

  <section id="resultView" class="panel hidden">
    <div id="resultBody"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
