<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valorant Map Ban</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>VALORANT <span>MAP BAN</span></h1>
  </header>

  <section id="setup" class="panel">
    <h2>ตั้งค่า</h2>
    <div class="row">
      <label>ทีม A <input id="teamA" value="Team A"></label>
      <label>ทีม B <input id="teamB" value="Team B"></label>
    </div>
    <details id="sheetBox" class="sheetbox">
      <summary>เชื่อม Google Sheet (ไม่บังคับ)</summary>
      <div class="row">
        <label>Apps Script URL <input id="sheetUrl" placeholder="https://script.google.com/macros/s/.../exec"></label>
        <label>รหัสลับ (TOKEN) <input id="sheetToken" type="password"></label>
        <button id="loadSheetBtn" type="button">โหลดรายการ</button>
      </div>
      <div class="row">
        <label>วันที่ (แท็บ) <select id="sheetDate"></select></label>
        <label>แมตช์ <select id="sheetMatch"></select></label>
      </div>
      <p class="hint" id="sheetMsg">เมื่อเลือกแมตช์ ชื่อทีมจะมาจากชีต และ ban/pick จะระบายสีในชีตให้อัตโนมัติ</p>
    </details>
    <p class="hint">เลือกแมพที่อยู่ใน Map Pool (คลิกเพื่อเปิด/ปิด) — ต้องเลือก 7 แมพพอดี (ban 2 → pick 2 → ban 2 → เหลือ 1 แมพ = เล่น 3 แมพ)</p>
    <div id="poolPicker" class="pool-picker"></div>
    <button id="startBtn" class="primary">เริ่ม Ban/Pick</button>
  </section>

  <section id="game" class="hidden">
    <div id="status" class="status"></div>
    <div id="maps" class="maps"></div>
    <div class="controls">
      <button id="undoBtn">↶ ย้อนกลับ</button>
      <button id="resetBtn">⟲ เริ่มใหม่</button>
    </div>
    <div id="result" class="panel hidden"></div>
    <div id="log" class="log"></div>
  </section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
